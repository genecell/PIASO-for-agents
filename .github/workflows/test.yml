name: test
# Execute every canonical code block (Python + R) against the fixtures, on the EXACT component
# versions meta.yaml says the docs were tested against (tests/requirements.txt). A release in any
# component repo (repository_dispatch) re-runs this suite, plus a nightly fallback, so the docs
# cannot silently rot against a new component version. The heavy job (real spatial + regulon
# runs, ~1 GB of downloads) runs nightly and on demand only.
on:
  push: { branches: [master] }
  pull_request:
  schedule:
    - cron: "0 5 * * *"          # nightly fallback
  repository_dispatch:
    types: [component-release]    # fired by PIASO/COSG/COSGR/LARIS/Emergene/cytome/cytorete on release
  workflow_dispatch:

jobs:
  python-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install the pinned ecosystem (no matplotlib pin — see gotchas.md)
        run: pip install -r tests/requirements.txt
      - name: Show what was installed
        run: pip list | grep -iE "piaso|cosg|cytome|laris|emergene|cytorete|matplotlib|scanpy|numpy"
      - name: Compile-check all python blocks + doc lint (offline)
        run: PIASO_SKIP_FUNCTIONAL=1 pytest tests/test_py_blocks.py -q -k "compile or no_"
      - name: Functional — PIASO-native pipeline, SCALAR, LARIS (synthetic), Emergene, live PIASOmarkerDB
        run: pytest tests/test_py_blocks.py -q
      - name: Functional — cytome streaming path
        run: pytest tests/test_cytome.py -q
      - name: Functional — cytorete (genome-free) + plotting (Agg)
        run: pytest tests/test_cytorete.py tests/test_plots.py -q

  clean-env-selfsufficiency:
    # Prove each components/*.md is self-sufficient: run its block with ONLY that component
    # installed (no piaso-tools; for cosg/cytome also no scanpy). Catches hidden dependencies.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [cosg, cytome, laris, emergene]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install ONLY ${{ matrix.component }} (no piaso-tools)
        run: pip install ${{ matrix.component }} igraph leidenalg h5py   # h5py: undeclared dep of cytome.from_10x_h5
      - name: Fetch the smallest PIASO-data fixture
        run: |
          curl -L "https://zenodo.org/api/records/22012620/files/SC3_v3_NextGem_DI_Nuclei_5K_SC3_v3_NextGem_DI_Nuclei_5K_count_sample_feature_bc_matrix.h5/content" \
            -o fixture.h5
      - name: Run ${{ matrix.component }} block with no piaso present
        run: python tests/clean_env/run_${{ matrix.component }}.py fixture.h5

  r-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: "4.4" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install COSGR + cytome (R) from r-universe binaries, SeuratObject/SCE from CRAN/Bioc
        run: |
          sudo apt-get update && sudo apt-get install -y liblz4-dev libzstd-dev zlib1g-dev
          Rscript -e 'install.packages(c("SeuratObject","proxyC","data.table","Matrix","BiocManager"), repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages(c("COSG","cytome"), repos=c("https://genecell.r-universe.dev","https://cloud.r-project.org"))'
          Rscript -e 'BiocManager::install(c("SingleCellExperiment","DelayedArray"), ask=FALSE, update=FALSE)'
      - name: Write a tiny .cytome from Python for the R round-trip
        run: |
          pip install cytome anndata
          python - <<'PY'
          import numpy as np, pandas as pd, scipy.sparse as sp, cytome
          rng = np.random.default_rng(0)
          ds = cytome.create("ref.cytome")
          ds.set_entity("cells", pd.DataFrame({"barcode": [f"c{i}" for i in range(120)], "cell_type": rng.choice(["A","B"], 120)}))
          ds.set_entity("genes", pd.DataFrame({"gene_id": [f"G{i}" for i in range(50)]}))
          ds.add_matrix("RNA_counts", sp.random(120, 50, density=0.2, format="csr", dtype=np.float32, random_state=rng))
          ds.add_embedding("RNA_umap", rng.normal(size=(120, 2)).astype(np.float32)); ds.flush(); ds.close()
          PY
      - name: Run R block parse checks + functional COSGR + cytome (R) round-trip
        run: PIASO_CYTOME_FILE=$PWD/ref.cytome Rscript tests/test_r_blocks.R

  heavy:
    # Real spatial (LARIS tonsil, 241 MB) + real regulon inference (SEA-AD cytome 269 MB + JASPAR +
    # hg38 .2bit ~800 MB). Nightly and on demand; ~20 min.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r tests/requirements.txt
      - name: LARIS on the tonsil + cytorete inferRegulon on the cortex cytome
        run: PIASO_HEAVY=1 pytest tests/test_laris.py tests/test_cytorete.py -q
